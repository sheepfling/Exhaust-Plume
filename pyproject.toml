[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exhaust-plume"
version = "0.1.0"
description = "Standalone compressible exhaust-plume model"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pyyaml",
  "scipy",
  "typing_extensions",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
exhaust-plume = "exhaust_plume.models.plume.run_plume_solve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

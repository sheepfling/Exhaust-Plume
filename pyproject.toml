[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exhaust-plume"
dynamic = ["version"]
description = "Standalone compressible exhaust-plume model"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "scipy",
  "typing_extensions",
]

[project.optional-dependencies]
plot = ["matplotlib", "mpmath", "sympy"]
test = ["pytest", "build", "matplotlib"]

[project.scripts]
exhaust-plume = "exhaust_plume.models.plume.run_plume_solve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exhaust_plume.etc" = ["*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "exhaust_plume.constants.VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

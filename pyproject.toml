[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exhaust-plume"
dynamic = ["version"]
description = "Standalone compressible exhaust-plume model"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic>=2,<3",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
plot = ["matplotlib"]
quality = ["pyright", "ruff"]
test = ["pytest", "build", "matplotlib", "jsonschema>=4"]
dev = [
    "build",
    "jsonschema>=4",
    "matplotlib",
    "pyright",
    "pytest",
    "rumdl>=0.2.49,<0.3",
    "ruff",
    "scope-markers>=0.0.1a0; python_version >= '3.11'",
]

[project.scripts]
exhaust-plume = "exhaust_plume.models.plume.run_plume_solve:main"
exhaust-plume-visualize = "exhaust_plume.products.visual_cli:main"
exhaust-plume-signature = "exhaust_plume.products.signature_cli:main"
exhaust-plume-validate = "exhaust_plume.validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exhaust_plume.etc" = ["*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "exhaust_plume.constants.VERSION"}

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 200
extend-exclude = ["build", "dist", "legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

version: 1
disable_existing_loggers: false

formatters:
  standard:
    (): exhaust_plume.log.colored_formatter.ColoredFormatter
    format: '%(levelname)s %(name)s: %(message)s'
    use_color: false
    use_icon: false

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stderr

root:
  level: INFO
  handlers:
    - console

schema_version: '1.0'
handoff_version: 4
project: Exhaust-Plume
repository: sheepfling/Exhaust-Plume
source_branch: feature/initial-work
authoritative_plan: 34_comprehensive_work_plan.md
principles:
- provider-specific inputs and generic capability outputs
- signature and spatial consumer profiles share one provider lifecycle
- morphology and fidelity are metadata, not API hierarchies
- geometry is optional
- physical termination is distinct from safety truncation
- no silent extrapolation, fallback, or fabricated capability
- SI units and radians internally
- one corrected core serves legacy and provider APIs
consumer_profiles:
  signature:
    minimum_capability: directional-spectral-intensity
    intrinsic_quantity: spectral radiant intensity
  spatial_physical:
    capabilities:
    - spatial-support
    - axisymmetric-zone-field
    - centerline-tube-field
    - local-flow-state
    - optical-medium
    - spectral-ray-transfer

rules:
  - Experimental source data remain immutable observation products.
  - Every experimental comparison uses an explicit measurement operator.
  - A passing component gate cannot hide a failed product gate.
  - Normalized spectra cannot support absolute-radiance claims.
  - Signature data cannot be inverted into geometry or per-ray optical state without a separate model.
  - Curved and straight plume morphologies share consumer contracts.
  - Cell-count safety bounds are not physical plume termination.
